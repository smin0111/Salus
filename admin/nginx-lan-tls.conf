# 집 LAN에서 관리자 화면을 HTTPS로 엽니다(home 모드 전용, docker-compose.admin-home.yml이 넣음).
# 인증서는 scripts/beta/admin-lan-cert.sh가 만든 집 전용 CA로 서명하며, 파일이 없으면 nginx가 뜨지 않습니다(닫힌 쪽으로 실패).
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/admin-certs/server.crt;
    ssl_certificate_key /etc/nginx/admin-certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/admin/locations.conf;
}

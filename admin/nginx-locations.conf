# 관리자 화면의 HTTP(127.0.0.1)·LAN HTTPS 서버가 함께 쓰는 경로 설정입니다.

location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8080;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    # 포트까지 넘겨야 백엔드가 같은 출처 요청으로 봅니다($host는 포트가 빠져 CORS에서 거절됨).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    # 보안 헤더(2026-11-01): 다른 사이트가 이 화면을 iframe에 넣어 누르게 하는 공격(클릭재킹)을 막고,
    # 파일 형식 추측과 주소(OAuth 인가 코드 포함)가 다른 사이트로 새는 것을 줄입니다.
    # /api 응답에는 붙이지 않습니다(백엔드 Spring Security가 따로 붙여 겹치면 값이 합쳐짐).
    # 전체 CSP(2026-11-01): 관리자 빌드의 스크립트는 전부 same-origin입니다(Vite 번들은 같은 출처 모듈 스크립트).
    #   script-src에 'unsafe-inline'/'unsafe-eval'을 넣지 않아 주입된 스크립트가 실행되지 못합니다.
    #   style-src 'unsafe-inline'은 번들이 주입하는 <style>을 위한 최소 허용이고, fonts.googleapis.com은 index.html의 웹폰트 스타일시트,
    #   font-src의 fonts.gstatic.com은 그 폰트 파일을 위한 것입니다. object-src 'none'·base-uri 'self'로 플러그인·base 태그 주입을 막습니다.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    try_files $uri $uri/ /index.html;
}

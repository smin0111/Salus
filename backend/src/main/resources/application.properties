spring.application.name=healthytable
server.port=8080
spring.mvc.async.request-timeout=${MVC_ASYNC_REQUEST_TIMEOUT:240000}

# 로컬 보안 설정 파일이 있으면 함께 불러옵니다.
spring.config.import=optional:classpath:application-secret.properties

# JWT 보안 설정
jwt.secret=${JWT_SECRET:HPgqzcjoLbLqK6CK/2YKy3fVBENIqo1d0OD4KTSSOkifQBFMKnmIklusctcblM6pTQcYI6X4b7hFSlUshMgZxA==}


# Gemini API 키는 application-secret.properties 또는 환경변수에서 불러옵니다.
# gemini.api.key=${gemini.api.key}

# 활성화할 LLM 프로바이더: gemini 또는 ollama
llm.provider=${LLM_PROVIDER:ollama}
ollama.model=${OLLAMA_MODEL:gemma2}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:180}
webclient.response-timeout-seconds=${WEBCLIENT_RESPONSE_TIMEOUT_SECONDS:240}
webclient.read-timeout-seconds=${WEBCLIENT_READ_TIMEOUT_SECONDS:240}
webclient.write-timeout-seconds=${WEBCLIENT_WRITE_TIMEOUT_SECONDS:10}

# RAG 운영 설정
rag.negative-cache-days=${RAG_NEGATIVE_CACHE_DAYS:7}
search.provider=${SEARCH_PROVIDER:duckduckgo}
tavily.api-key=${TAVILY_API_KEY:}

# MySQL 데이터베이스 설정
spring.datasource.url=jdbc:mysql://localhost:3306/mychefai?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 비밀번호는 application-secret.properties 또는 환경변수에서 불러옵니다.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 짧게 유지되는 AI 작업 세션을 위한 Redis 설정
# 로컬 실행 방법: docker compose up -d redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# JPA 설정
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Copy this file to application-secret.properties for local development.
# Never commit real secrets.

# JWT_SECRET must be at least 32 bytes for HS256.
jwt.secret=replace-with-at-least-32-byte-local-secret

# Database password
spring.datasource.password=replace-with-local-db-password

# Gemini API key
gemini.api.key=replace-with-gemini-api-key

# PortOne API keys
iamport.api.key=replace-with-portone-api-key
iamport.api.secret=replace-with-portone-api-secret

# Optional search provider
search.provider=duckduckgo
tavily.api-key=

# Optional Naver OAuth backend secret
naver.client.id=
naver.client.secret=

# 로컬 개발 시 이 파일을 application-secret.properties로 복사해서 사용합니다.
# 실제 비밀 값은 절대 커밋하지 마세요.

# JWT_SECRET은 HS256 서명을 위해 최소 32바이트 이상이어야 합니다.
jwt.secret=replace-with-at-least-32-byte-local-secret

# 데이터베이스 비밀번호
spring.datasource.password=replace-with-local-db-password

# Gemini API 키
gemini.api.key=replace-with-gemini-api-key

# 포트원(PortOne) V2 API 시크릿·웹훅 시크릿(콘솔 > 결제 연동 > 연동 정보)
portone.api.secret=replace-with-portone-v2-api-secret
portone.webhook.secret=replace-with-portone-webhook-secret
# 상점 ID·채널 키는 비밀은 아니지만 계정마다 달라 여기나 환경 변수(PAYMENT_PORTONE_STORE_ID 등)로 넣습니다.
payment.portone.store-id=replace-with-portone-store-id
payment.portone.channel-key=replace-with-portone-channel-key

# 선택: 검색 엔진 설정 (duckduckgo 또는 tavily)
search.provider=duckduckgo
tavily.api-key=

# 선택: 네이버 OAuth 서버용 client id/secret
naver.client.id=
naver.client.secret=

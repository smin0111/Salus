# 식약처 알레르기 유발물질 표시 대상을 기준으로 한 알레르겐 계층 사전.
#
# aliases: 같은 알레르겐을 가리키는 다른 이름. 사용자가 프로필에 입력할 수 있는 표기.
# derived: 해당 알레르겐이 들어가는 파생 재료와 가공품. 재료명에 루트가 드러나지
#          않아 문자열 포함만으로는 잡히지 않는 것들이다.
# name/declarationAliases: 공식 함유 표시 Parser에서 허용하는 직접 명칭.
# lexicalHints: 어휘상 연관만 있는 표현. Declaration Evidence로 사용하지 않는다.
# registryDerived: 라벨 Registry 전용 파생 별칭. 기존 프로필 Matcher 범위는 유지한다.
# declarationAllergens: 라벨 관찰 전용 ID/그룹. 기존 Matcher의 루트를 추가하지 않는다.
# parent: Registry의 명시적 부모 ID. 라벨의 explicitChildren이나 안전 판정으로 확장하지 않는다.
# labelCheck: 제품에 따라 이 알레르겐이 들어 있을 수 있는 재료. 차단하지 않고 성분 표시 확인을 안내한다.
#
# 한 글자 용어는 토큰 전체가 일치할 때만 매칭한다. "밀"이 "밀크"에,
# "게"가 "게으른"에 걸리는 오탐을 막기 위해서다. 파생 재료가 실제 탐지를 담당한다.

allergens:
  - id: EGG
    name: 계란
    declarationAliases: [달걀]
    registryDerived: [전란액]
    parent: EGG_GROUP
    # 프로필 Matcher의 기존 별칭 호환성 유지. 라벨의 알류/난류는 아래 EGG_GROUP으로 구분.
    aliases: [계란, 달걀, 난류, 알류, egg]
    # "반숙 후라이"처럼 계란 이름 없이 쓰는 표현도 봅니다(2026-10-14 계란 알레르기 비빔밥 단계에 남음).
    # "후라이"는 "후라이팬"에도 걸려 넣지 않습니다.
    derived: [마요네즈, 머랭, 카스터드, 커스터드, 난백, 난황, 흰자, 노른자, 계란물, 달걀물, 마요, 타르타르소스, 지단,
              반숙, 수란, 스크램블, 오믈렛]

  - id: MILK
    name: 우유
    declarationAliases: [원유]
    lexicalHints: [우유향, 버터향]
    registryDerived: [탈지분유, 혼합탈지분유, 전지분유, 카제인나트륨, 유청, 유크림]
    aliases: [우유, 유제품, milk]
    # 2026-10-17: "우유 알레르기"인데 승인 레시피의 "파르미자노 레지아노 20g"을 잡지 못함 → 치즈 원어 이름·유단백 추가.
    # 두 낱말 이름(그라나 파다노)은 낱말 단위로 비교하므로 한 낱말씩 넣습니다. "브리"(브리스킷 오탐), "밀크"(코코넛밀크 오탐)는 넣지 않습니다.
    derived: [버터, 치즈, 생크림, 휘핑크림, 연유, 분유, 요거트, 요구르트, 크림, 버터밀크, 사워크림, 리코타, 모짜렐라, 파르메산, 체다, 크림치즈, 가염버터, 무염버터, 우유식빵, 아이스크림,
              파르미자노, 파르미지아노, 레지아노, 파마산, 파다노, 페코리노, 마스카포네, 고르곤졸라, 까망베르, 카망베르, 에멘탈, 그뤼에르, 부라타, 할루미, 유청, 카제인]

  - id: WHEAT
    name: 밀
    registryDerived: [소맥분]
    aliases: [밀, 소맥, wheat, 글루텐]
    # 카레(고형·가루)·춘장·어묵은 시판품 대부분이 밀가루를 넣어 만듭니다(2026-10-14 밀 알레르기에 "고체 카레", "사각어묵"이 제공됨).
    # 오코노미야키·타코야키 가루와 짜장가루도 밀가루가 주원료입니다(2026-10-14 "오코노미야끼 파우더"가 제공됨).
    # 너겟·돈가스·카츠는 밀가루·빵가루 튀김옷 제품입니다(2026-10-14 배포 전 평가: 밀 알레르기에 "치킨너겟 20개"가 제공됨).
    # 만두·빵·과자류는 밀가루가 기본 재료라 함께 넣습니다(쌀로 만든 제품은 드물고, 모르면 안전하지 않음).
    derived: [밀가루, 박력분, 중력분, 강력분, 부침가루, 튀김가루, 빵가루, 국수, 소면, 칼국수, 라면, 파스타, 스파게티, 마카로니, 우동, 수제비, 만두피, 식빵, 바게트, 크래커, 밀떡, 밀전병, 카레, 춘장, 어묵,
              만두, 또띠아, 토르티야, 케이크, 쿠키, 비스킷, 와플, 팬케이크, 핫케이크, 크루아상, 크로와상, 크로아상, 도넛,
              머핀, 베이글, 모닝빵, 햄버거빵, 핫도그빵,
              오코노미야키, 오코노미야끼, 타코야키, 타코야끼, 짜장,
              너겟, 너깃, 돈가스, 돈까스, 카츠, 커틀릿]
    # 진간장·고추장·된장은 밀이 든 제품이 많지만, 막으면 밀 알레르기 사용자에게 한식 대부분이 제공되지 않습니다.
    # 차단 대신 성분 표시 확인을 안내합니다(2026-10-14 사용자 결정 "다").
    labelCheck: [간장, 고추장, 된장, 쌈장, 굴소스]

  - id: SOY
    name: 대두
    lexicalHints: [콩]
    registryDerived: [분리대두단백, 대두레시틴]
    aliases: [대두, 콩, 콩류, soy, soybean]
    # 짜장(가루·소스)은 춘장으로 만듭니다(2026-10-14 대두 알레르기에 짜장밥 "짜장가루"가 제공됨).
    derived: [두부, 된장, 간장, 고추장, 쌈장, 청국장, 두유, 콩나물, 콩기름, 대두유, 유부, 순두부, 연두부, 콩가루, 춘장, 짜장]

  - id: PEANUT
    name: 땅콩
    aliases: [땅콩, peanut]
    # "견과(류)"는 어떤 견과인지 알 수 없어 땅콩·호두·잣 모두로 봅니다(모르면 안전하지 않음).
    # 2026-10-14 땅콩 알레르기에 팟타이 "견과류 1줌"이 그대로 제공됨.
    derived: [땅콩버터, 땅콩분태, 땅콩가루, 피넛버터, 땅콩소스, 견과]

  - id: WALNUT
    name: 호두
    aliases: [호두, walnut]
    derived: [호두과자, 호두정과, 견과]

  - id: PINE_NUT
    name: 잣
    aliases: [잣]
    derived: [잣가루, 잣죽, 페스토, 견과]

  - id: BUCKWHEAT
    name: 메밀
    aliases: [메밀, buckwheat]
    derived: [메밀면, 냉면, 막국수, 메밀가루, 소바]

  - id: CRAB
    name: 게
    aliases: [게, crab]
    derived: [게살, 게장, 꽃게, 대게, 킹크랩, 게맛살, 크래미, 간장게장, 양념게장]

  - id: SHRIMP
    name: 새우
    registryDerived: [건새우분말, 새우추출물분말]
    lexicalHints: [새우풍미유]
    aliases: [새우, shrimp]
    # 모듬해물·해물믹스는 무엇이 들었는지 알 수 없어 새우·오징어·조개류 모두로 봅니다(모르면 안전하지 않음).
    derived: [건새우, 새우젓, 대하, 칵테일새우, 새우가루, 액젓, 오징어젓, 모듬해물, 모둠해물, 해물믹스, 냉동해물, 씨푸드믹스]

  - id: SQUID
    name: 오징어
    aliases: [오징어, squid]
    # 2026-10-14 오징어 알레르기에 팔보채 "모듬해물 400g"이 제공됨.
    derived: [진미채, 오징어채, 마른오징어, 한치, 모듬해물, 모둠해물, 해물믹스, 냉동해물, 씨푸드믹스]

  - id: MACKEREL
    name: 고등어
    aliases: [고등어, mackerel]
    derived: [자반고등어, 고등어살]

  - id: SHELLFISH
    name: 조개류
    aliases: [조개, 조개류, shellfish]
    # 2026-10-14 실사용 시뮬레이션: 조개류 알레르기에 꼬막비빔밥("꼬막 1kg")이 그대로 제공됨. 흔한 조개 이름을 보강합니다.
    # "조갯살"은 사이시옷 때문에 "조개"로 잡히지 않고, 한 글자 "굴"은 낱말 전체가 같을 때만 잡혀 "굴전"을 놓칩니다
    # (2026-10-14 조개류 알레르기에 클램차우더 "조갯살 20g"이 제공됨).
    derived: [굴, 전복, 홍합, 바지락, 모시조개, 가리비, 소라, 굴소스, 조개육수, 꼬막, 재첩, 대합, 동죽, 관자, 키조개, 맛조개,
              조갯살, 클램, clam, 굴전, 굴국, 굴밥, 굴무침, 생굴, 석화, 모듬해물, 모둠해물, 해물믹스, 냉동해물, 씨푸드믹스]

  - id: PEACH
    name: 복숭아
    aliases: [복숭아, peach]
    derived: [황도, 백도, 복숭아통조림, 복숭아잼]

  - id: TOMATO
    name: 토마토
    aliases: [토마토, tomato]
    derived: [케첩, 토마토소스, 토마토페이스트, 방울토마토, 홀토마토, 마리나라]

  - id: PORK
    name: 돼지고기
    declarationAliases: [돈육, 돼지]
    aliases: [돼지고기, 돈육, pork]
    derived: [삼겹살, 목살, 베이컨, 햄, 소시지, 등심, 앞다리살, 항정살, 갈비, 라드, 돈까스]

  - id: BEEF
    name: 쇠고기
    declarationAliases: [소고기, 우육]
    lexicalHints: [비프맛양념]
    aliases: [쇠고기, 소고기, 우육, beef]
    derived: [사골, 우삼겹, 차돌박이, 등심, 안심, 양지, 사태, 소갈비, 육수, 불고기]

  - id: CHICKEN
    name: 닭고기
    declarationAliases: [계육]
    aliases: [닭고기, 계육, chicken]
    derived: [닭가슴살, 닭다리, 닭날개, 치킨스톡, 닭육수, 삼계]

  - id: SULFITE
    name: 아황산류
    declarationAliases: [산성아황산나트륨]
    aliases: [아황산, 아황산류, sulfite]
    derived: [건포도, 건살구, 와인, 물엿]

declarationAllergens:
  - id: EGG_GROUP
    name: 알류
    declarationAliases: [난류]
  - id: QUAIL_EGG
    name: 메추리알
    parent: EGG_GROUP
  - id: OYSTER
    name: 굴
    parent: SHELLFISH
  - id: ABALONE
    name: 전복
    parent: SHELLFISH
  - id: MUSSEL
    name: 홍합
    parent: SHELLFISH

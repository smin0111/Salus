name: 지속적 통합 검사

# 브랜치 흐름: feat/*·fix/*·chore/* → develop(베타에서 검증) → main. 긴급 수정은 hotfix/* → main.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "hotfix/**"
      - "feature/**"
      - "feature-*"
      - "hotfix-*"
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven 테스트 실행
        run: mvn test

  backend-mysql-it:
    name: 백엔드 MySQL 통합 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 빈 MySQL 8.0에 Flyway V1부터 전부 적용하고 엔티티 매핑(ddl-auto=validate)을 확인합니다.
    # 비밀번호는 CI 전용 임시 컨테이너에만 쓰는 값이라 저장소 비밀값이 아닙니다.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: salus-ci-only
          MYSQL_DATABASE: salus_it
          TZ: Asia/Seoul
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psalus-ci-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SALUS_IT_MYSQL_URL: jdbc:mysql://127.0.0.1:13306/salus_it
      SALUS_IT_MYSQL_PASSWORD: salus-ci-only
      # 운영(docker-compose.prod.yml TZ)과 같이 JVM 시간대를 DB 연결(serverTimezone=Asia/Seoul)과 맞춥니다.
      # 러너 기본값(UTC)이면 JDBC로 직접 넣은 시각과 Hibernate가 읽는 시각이 9시간 어긋납니다.
      TZ: Asia/Seoul
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: MySQL 통합 테스트 실행
        run: mvn -Dtest='*MySqlIT' -Dsurefire.failIfNoSpecifiedTests=false test

      # 환경변수가 없으면 통합 테스트가 모두 건너뛰고도 성공하므로, 실제로 실행됐는지 확인합니다.
      - name: 건너뛴 통합 테스트가 없는지 확인
        run: |
          python3 - <<'EOF'
          import glob, re, sys
          total = skipped = 0
          for path in glob.glob('target/surefire-reports/TEST-*MySqlIT.xml'):
              head = open(path, encoding='utf-8').read(800)
              m = re.search(r'tests="(\d+)" errors="\d+" skipped="(\d+)"', head)
              if m:
                  total += int(m.group(1)); skipped += int(m.group(2))
          print(f"MySQL IT tests={total} skipped={skipped}")
          sys.exit(0 if total > 0 and skipped == 0 else 1)
          EOF

  admin-build:
    name: 어드민 빌드와 보안 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 의존성 보안 검사
        run: npm audit --audit-level=moderate

      - name: 어드민 앱 빌드
        run: npm run build

  frontend-web-export:
    name: 프론트엔드 웹 내보내기
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 로컬 앱 설정 준비
        run: cp src/secrets.example.js src/secrets.js

      - name: 높음 이상 보안 취약점 차단
        run: node ../.github/scripts/npm-audit-policy.mjs high frontend

      - name: 웹 번들 생성
        run: npx expo export --platform web --output-dir dist

  frontend-android-gradle-check:
    name: Android Gradle 설정 확인
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 로컬 앱 설정 준비
        run: cp src/secrets.example.js src/secrets.js

      - name: Android 서명과 Gradle 설정 확인
        env:
          NODE_ENV: development
        run: |
          cd android
          ./gradlew :app:signingReport :app:validateSigningDebug

  docker-build:
    name: Docker 이미지 빌드 확인
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 운영 Docker Compose 설정 검증
        if: ${{ hashFiles('.env.example') != '' && hashFiles('docker-compose.prod.yml') != '' }}
        run: docker compose --env-file .env.example -f docker-compose.prod.yml config

      - name: 백엔드 이미지 빌드
        run: docker build -t salus-backend:ci ./backend

      - name: 백엔드 컨테이너 non-root 확인
        run: docker run --rm --entrypoint sh salus-backend:ci -c 'test "$(id -u)" = "10001"'

      - name: 어드민 이미지 빌드
        run: docker build --build-arg VITE_API_BASE_URL=/api -t salus-admin:ci ./admin

      - name: 어드민 컨테이너 non-root 확인
        run: docker run --rm --entrypoint sh salus-admin:ci -c 'test "$(id -u)" != "0"'

      - name: 어드민 정적 페이지 응답 확인
        run: |
          docker run -d --name salus-admin-ci-check -p 18081:8080 salus-admin:ci
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:18081/ >/tmp/salus-admin-index.html 2>/tmp/salus-admin-curl.log; then
              docker rm -f salus-admin-ci-check
              exit 0
            fi
            sleep 1
          done
          cat /tmp/salus-admin-curl.log
          docker logs salus-admin-ci-check
          docker rm -f salus-admin-ci-check
          exit 1

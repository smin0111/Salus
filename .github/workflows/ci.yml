name: 지속적 통합 검사

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven 테스트 실행
        run: mvn test

  admin-build:
    name: 어드민 빌드와 보안 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 의존성 보안 검사
        run: npm audit --audit-level=moderate

      - name: 어드민 앱 빌드
        run: npm run build

  frontend-web-export:
    name: 프론트엔드 웹 내보내기
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 로컬 앱 설정 준비
        run: cp src/secrets.example.js src/secrets.js

      - name: 높음 이상 보안 취약점 차단
        run: npm audit --audit-level=high

      - name: 웹 번들 생성
        run: npx expo export --platform web --output-dir dist

  docker-build:
    name: Docker 이미지 빌드 확인
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: 운영 Docker Compose 설정 검증
        run: docker compose --env-file .env.example -f docker-compose.prod.yml config

      - name: 백엔드 이미지 빌드
        run: docker build -t salus-backend:ci ./backend

      - name: 백엔드 컨테이너 non-root 확인
        run: docker run --rm --entrypoint sh salus-backend:ci -c 'test "$(id -u)" = "10001"'

      - name: 어드민 이미지 빌드
        run: docker build --build-arg VITE_API_BASE_URL=/api -t salus-admin:ci ./admin

      - name: 어드민 컨테이너 non-root 확인
        run: docker run --rm --entrypoint sh salus-admin:ci -c 'test "$(id -u)" != "0"'

      - name: 어드민 정적 페이지 응답 확인
        run: |
          docker run -d --name salus-admin-ci-check -p 18081:8080 salus-admin:ci
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:18081/ >/tmp/salus-admin-index.html 2>/tmp/salus-admin-curl.log; then
              docker rm -f salus-admin-ci-check
              exit 0
            fi
            sleep 1
          done
          cat /tmp/salus-admin-curl.log
          docker logs salus-admin-ci-check
          docker rm -f salus-admin-ci-check
          exit 1

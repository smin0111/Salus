name: 지속적 통합 검사

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"

jobs:
  backend-test:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven 테스트 실행
        run: mvn test

  admin-build:
    name: 어드민 빌드와 보안 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 의존성 보안 검사
        run: npm audit --audit-level=moderate

      - name: 어드민 앱 빌드
        run: npm run build

  frontend-web-export:
    name: 프론트엔드 웹 내보내기
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 로컬 앱 설정 준비
        run: cp src/secrets.example.js src/secrets.js

      - name: 높음 이상 보안 취약점 차단
        run: npm audit --audit-level=high

      - name: 웹 번들 생성
        run: npx expo export --platform web --output-dir dist

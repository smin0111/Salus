services:
  mysql:
    # Spring Boot 3.2.x가 관리하는 Flyway 9.22.x와 맞춘 MySQL 8.0 계열입니다.
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mychefai}
      MYSQL_USER: ${MYSQL_USER:-salus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: ${APP_TIME_ZONE:-Asia/Seoul}
    volumes:
      - salus-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - salus-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    stop_grace_period: ${BACKEND_STOP_GRACE_PERIOD:-40s}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mychefai}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-salus}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:-30s}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Seoul}
      APP_ADMIN_IP_WHITELIST_ENABLED: ${APP_ADMIN_IP_WHITELIST_ENABLED:-false}
      APP_ADMIN_ALLOWED_IPS: ${APP_ADMIN_ALLOWED_IPS:-127.0.0.1,::1}
      MONITOR_DISPLAY_TOKEN_HASHES: ${MONITOR_DISPLAY_TOKEN_HASHES:-}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-}
      ADMIN_TOTP_ENCRYPTION_KEY: ${ADMIN_TOTP_ENCRYPTION_KEY:-}
      APP_CHAT_RATE_LIMIT_ENABLED: ${APP_CHAT_RATE_LIMIT_ENABLED:-true}
      APP_CHAT_RATE_LIMIT_GUEST_MAX_REQUESTS_PER_MINUTE: ${APP_CHAT_RATE_LIMIT_GUEST_MAX_REQUESTS_PER_MINUTE:-10}
      APP_CHAT_RATE_LIMIT_AUTHENTICATED_MAX_REQUESTS_PER_MINUTE: ${APP_CHAT_RATE_LIMIT_AUTHENTICATED_MAX_REQUESTS_PER_MINUTE:-60}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_PRIMARY_URL: ${OLLAMA_PRIMARY_URL:-http://host.docker.internal:11434/api/chat}
      OLLAMA_SECONDARY_URL: ${OLLAMA_SECONDARY_URL:-http://host.docker.internal:11435/api/chat}
      # 웹 레시피 출처 검색. DuckDuckGo 스크래핑은 연속 호출 시 차단되어 자체 SearXNG를 씁니다(2026-10-14 베타 결정).
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-searxng}
      SEARXNG_BASE_URL: http://searxng:8080
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MFDS_RECIPE_SOURCE_ENABLED: ${MFDS_RECIPE_SOURCE_ENABLED:-false}
      MFDS_RECIPE_API_KEY: ${MFDS_RECIPE_API_KEY:-}
      # 베타에서는 Recipe Agent(웹 출처 추출·검증) 경로를 씁니다(2026-10-14 결정). 끄려면 .env에서 false로 바꿉니다.
      RECIPE_AGENT_ENABLED: ${RECIPE_AGENT_ENABLED:-true}
      RECIPE_AGENT_INITIAL_ROUTING_ENABLED: ${RECIPE_AGENT_INITIAL_ROUTING_ENABLED:-true}
      RECIPE_AGENT_SOURCE_DISCOVERY_ENABLED: ${RECIPE_AGENT_SOURCE_DISCOVERY_ENABLED:-true}
      RECIPE_AGENT_WEB_SOURCE_ENABLED: ${RECIPE_AGENT_WEB_SOURCE_ENABLED:-true}
      RECIPE_AGENT_TEXT_EXTRACTION_ENABLED: ${RECIPE_AGENT_TEXT_EXTRACTION_ENABLED:-true}
      RECIPE_AGENT_TEXT_EXTRACTION_MODEL: ${RECIPE_AGENT_TEXT_EXTRACTION_MODEL:-gemma3:4b}
      # 베타 배포에서는 유튜브 출처를 쓰지 않습니다(무료 할당량 한계, 2026-10-14 결정, 추후 고도화).
      # compose가 같은 폴더의 .env를 자동으로 읽어 로컬 개발용 true가 배포에 섞이지 않도록 값을 고정합니다.
      RECIPE_AGENT_YOUTUBE_SOURCE_ENABLED: "false"
      RECIPE_AGENT_YOUTUBE_TRANSCRIPT_ENABLED: "false"
      RECIPE_AGENT_MEDICATION_INTERACTION_ENABLED: ${RECIPE_AGENT_MEDICATION_INTERACTION_ENABLED:-false}
      RECIPE_AGENT_MEDICATION_LIVE_EVAL_ENABLED: ${RECIPE_AGENT_MEDICATION_LIVE_EVAL_ENABLED:-false}
      RECIPE_AGENT_MFDS_DRUG_PRODUCT_PERMIT_ENABLED: ${RECIPE_AGENT_MFDS_DRUG_PRODUCT_PERMIT_ENABLED:-false}
      RECIPE_AGENT_MFDS_MEDICATION_ENABLED: ${RECIPE_AGENT_MFDS_MEDICATION_ENABLED:-false}
      RECIPE_AGENT_OPENFDA_MEDICATION_ENABLED: ${RECIPE_AGENT_OPENFDA_MEDICATION_ENABLED:-false}
      RECIPE_AGENT_RXNORM_ENABLED: ${RECIPE_AGENT_RXNORM_ENABLED:-false}
      YOUTUBE_API_KEY: ""
      MFDS_MEDICATION_API_KEY: ${MFDS_MEDICATION_API_KEY:-}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      # 게스트 IP는 이 범위의 프록시(맥북 자신, docker 내부망의 nginx)를 거친 경우에만 X-Forwarded-For에서 읽습니다.
      APP_CLIENT_IP_TRUSTED_PROXIES: ${APP_CLIENT_IP_TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}
      IAMPORT_API_KEY: ${IAMPORT_API_KEY:?IAMPORT_API_KEY is required}
      IAMPORT_API_SECRET: ${IAMPORT_API_SECRET:?IAMPORT_API_SECRET is required}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      OAUTH_GOOGLE_CLIENT_IDS: ${OAUTH_GOOGLE_CLIENT_IDS:-}
      OAUTH_KAKAO_APP_ID: ${OAUTH_KAKAO_APP_ID:-}
      OAUTH_APPLE_CLIENT_IDS: ${OAUTH_APPLE_CLIENT_IDS:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_WEB_AUTH_CALLBACK_URI: ${KAKAO_WEB_AUTH_CALLBACK_URI:-}
    # 백엔드는 맥북 안에서만 열고, 외부 접속은 web(nginx)의 /api를 거치게 합니다.
    # 0.0.0.0으로 열면 같은 네트워크에서 nginx를 건너뛰고 바로 들어와 X-Forwarded-For를 마음대로 적을 수 있습니다.
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"

  # 레시피 출처 검색용 메타검색(외부 포트는 열지 않고 backend에서만 씁니다).
  # searxng/settings.yml은 비밀값(secret_key)이 있어 git에 없습니다. 배포 서버에 따로 만들어 두어야 합니다.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ./admin
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-8081}:8080"

  # 사용자용 웹 화면입니다. 같은 주소의 /api를 backend로 넘기므로 터널(Tailscale Funnel 등)은 이 포트 하나만 열면 됩니다.
  # frontend/src/secrets.js(gitignored)가 배포 서버에 있어야 빌드됩니다.
  web:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8090}:8080"

volumes:
  salus-mysql-data:
  salus-redis-data:

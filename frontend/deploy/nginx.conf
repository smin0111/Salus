server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # 오류 화면·응답 헤더에 nginx 버전을 드러내지 않습니다.
    server_tokens off;

    # 사진 업로드는 백엔드 한도(10MB)에 맞춥니다.
    client_max_body_size 10m;

    # 관리자·관제 API는 공개 사용자 웹으로 넘기지 않습니다(관리자 화면은 admin 컨테이너 주소로만 씁니다).
    # 끝 슬래시가 없는 /api/admin, 경로 변수가 붙은 /api/admin;x, 대소문자를 바꾼 경로도 함께 막습니다.
    location ~* "^/api/(admin|monitor)(/|;|$)" {
        return 404;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # 포트까지 넘겨야 백엔드가 같은 출처 요청으로 봅니다($host는 포트가 빠져 CORS에서 거절됨).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 레시피 생성은 백엔드에서 최대 240초까지 걸립니다. 기본값(60초)이면 중간에 끊겨 빈 응답이 됩니다.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        # 보안 헤더(2026-11-01): 다른 사이트가 이 화면을 iframe에 넣어 누르게 하는 공격(클릭재킹)을 막고,
        # 파일 형식 추측과 주소(OAuth 인가 코드 포함)가 다른 사이트로 새는 것을 줄입니다.
        # /api 응답에는 붙이지 않습니다(백엔드 Spring Security가 따로 붙여 겹치면 값이 합쳐짐).
        # 전체 CSP(2026-11-01): script-src는 same-origin 번들 + 포트원 결제 SDK(cdn.portone.io)만 허용하고
        #   'unsafe-inline'/'unsafe-eval'은 넣지 않아, 주입된 스크립트가 실행되지 못합니다(핵심 XSS 방어).
        #   style-src 'unsafe-inline'은 react-native-web이 런타임에 주입하는 <style>과 index.html의 인라인 리셋을 위한 것입니다.
        #   connect-src는 동일 출처(API) + 포트원(SDK가 결제창을 준비할 때 checkout-service.prod.iamport.co를 부름, 2026-11-03 확인), frame-src https:는 포트원 결제창과 그 안의 PG·카드사 도메인을 위한 허용입니다
        #   (프레임에 끼워지는 공격은 frame-ancestors 'none'으로 따로 막습니다). object-src 'none'·base-uri 'self'로 플러그인·base 태그 주입 차단.
        #   소셜 로그인(구글·카카오·네이버)은 스크립트 주입이 아니라 전체 페이지 이동이라 script-src에 추가할 필요가 없습니다.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://cdn.portone.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://cdn.portone.io https://*.portone.io https://*.iamport.co; frame-src 'self' https:; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Salus</title>
    <!-- 베타 기간에는 검색 결과에 나오지 않게 합니다(robots.txt와 함께 사용). -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- 카카오톡 등에서 링크를 보낼 때 보이는 미리보기입니다. 의료 조언이 아니라는 점과 어긋나지 않게 씁니다. -->
    <meta name="description" content="알레르기와 건강 정보를 반영해 출처가 있는 레시피를 찾아 주는 AI 셰프" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Salus" />
    <meta property="og:title" content="Salus · AI 셰프 스튜디오" />
    <meta property="og:description" content="알레르기와 건강 정보를 반영해 출처가 있는 레시피를 찾아 드려요. (베타)" />
    <meta property="og:image" content="/og-image.png" />

    <meta property="og:image:height" content="1024" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
